name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: go vet github.com/isaackogan/tls-impersonate-proxy/...
      - run: go build github.com/isaackogan/tls-impersonate-proxy/...
      - run: go test github.com/isaackogan/tls-impersonate-proxy/internal/tests/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest github.com/isaackogan/tls-impersonate-proxy/...
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: false
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/tip
      - run: helm template tip helm/tip > /dev/null
