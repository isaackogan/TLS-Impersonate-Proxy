replicaCount: 1

image:
  repository: ghcr.io/isaackogan/tls-impersonate-proxy
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

admin:
  service:
    enabled: true
    port: 9090

# The CA can come from a Secret instead of being generated on a volume.
# existingSecret names a Secret holding the certificate and key under certKey and keyKey.
# cert and key, given inline (for example with --set-file ca.cert=ca.pem --set-file ca.key=ca.key),
# make the chart create that Secret itself. Either way persistence is unused and the mount is read-only.
ca:
  existingSecret: ""
  cert: ""
  key: ""
  certKey: ca.pem
  keyKey: ca.key

# Used only when no CA Secret is configured: TIP generates a CA on this volume at first start.
persistence:
  enabled: true
  size: 16Mi
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

serviceMonitor:
  enabled: false
  interval: 30s

# Keeps replicas serving through node drains. Off by default: with replicaCount 1 a budget of 1 would block every drain.
# Set maxUnavailable to use that form instead of minAvailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Seconds the pod sleeps after being marked for deletion and before TIP gets SIGTERM, so endpoint removal
# propagates while TIP still serves (Kubernetes 1.30+ sleep handler). 0 disables the hook.
preStopSleepSeconds: 5

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The tip.yaml document, verbatim. Every key tip.yaml accepts is accepted here, for example:
#   directives: {defaults: {Browser: Chrome, Os: Random}, deny: [Proxy]}
#   auth: {users: {alice: secret}}   # better supplied through --set or a values file kept out of git
# replicaCount above 1 needs a ReadWriteMany claim, or every replica mints its own CA.
config:
  server:
    listen: ":8080"
  tls:
    ca_cert: /var/lib/tip/ca.pem
    ca_key: /var/lib/tip/ca.key
  metrics:
    listen: ":9090"
  logging:
    level: info
    format: json
