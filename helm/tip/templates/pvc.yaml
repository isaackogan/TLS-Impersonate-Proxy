{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not (include "tip.caSecret" .)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tip.fullname" . }}
  labels: {{- include "tip.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
