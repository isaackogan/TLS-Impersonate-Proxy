version: 2
project_name: tip
builds:
  - main: ./cmd/tip
    dir: .
    binary: tip
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, docs/tip.example.yaml]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
      order: 999
